<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Claim 169 Example</title>
    <link rel="stylesheet" href="styles.css">
    <style>

        .svg-arrow-button {
            padding: 10px 20px;
            background-color: #04AA6D;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            height: 50px;
        }

        .svg-arrow-button:hover {
            background-color: #218838;
        }

        .arrow-icon {
            width: 1em; /* or specific px/rem for control */
            height: 1em;
            stroke: white; /* Color of the SVG icon */
        }

        /* For icon-only buttons, adjust size */
        .svg-icon-button .arrow-icon {
            width: 24px; /* Larger for icon-only */
            height: 24px;
            stroke: #333; /* Different color example */
        }
    </style>
</head>
<body>

<h2>Claim 169 QR Code Generator</h2>

<div id="json-container">
    <div class="container">
        <div style="flex: 1; padding: 20px;height: 650px">
            <textarea id="json-text" placeholder="Paste Your JSON Here"></textarea>
        </div>
        <button class="svg-arrow-button" onclick="generateCwt()">
            Generate QR
            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
        <div style="flex: 1; padding: 20px;height: 652px">
            <div style="border: 1px solid black; height: 654px">
                <img id="qr-image" src="" height="650px">
            </div>
        </div>
    </div>
    <div id="download-section" style="visibility: hidden">
        <a id='download' href="" title="ImageName">
            <button>Download</button>
        </a>
    </div>
    <h3 id="error" style="visibility: hidden">Invalid JSON</h3>
    <h3 id="cwt-size"></h3>
    <h4 id="out-cwt" style="overflow: scroll;font-family: 'Andale Mono';overflow-wrap: break-word;"></h4>
</div>
</body>

<script>
    function generateCwt() {
        document.getElementById("qr-image").style.visibility = "hidden";
        try {
            let jsonString = JSON.stringify(JSON.parse(document.getElementById("json-text").value))
            document.getElementById("error").style.visibility = "hidden";

            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState === 4 && this.status === 200) {
                    console.log(xhttp.responseText)
                    generateQR(xhttp.responseText)
                }
            };
            xhttp.open("POST", 'convert', true);
            xhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
            xhttp.send(jsonString);
        } catch (e) {
            console.log(e)
            document.getElementById("error").style.visibility = "visible";
            document.getElementById("cwt-size").style.visibility = "hidden";
            document.getElementById("out-cwt").style.visibility = "hidden";
        }
    }

    function generateQR(cwt) {
        try {
            document.getElementById("error").style.visibility = "hidden";
            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState === 4 && this.status === 200) {
                    console.log(xhttp.responseText)
                }
                let response = JSON.parse(xhttp.responseText)
                document.getElementById("qr-image").src = response[2];
                document.getElementById("download").href = response[2];
                document.getElementById("download").download = `QR_v${response[0]}.PNG`
                document.getElementById("qr-image").style.visibility = "visible";
                document.getElementById("download-section").style.visibility = "visible"
                document.getElementById("cwt-size").innerText = `CWT data size in bytes : ${cwt.length / 2}`
                document.getElementById("cwt-size").style.visibility = "visible";
                document.getElementById("out-cwt").innerText = "Decoded CWT : \n" + response[3]
            };
            xhttp.open("POST", 'qr', true);
            xhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
            xhttp.send(JSON.stringify({"cwt": cwt}));

        } catch (e) {
            document.getElementById("error").style.visibility = "visible";
            document.getElementById("qr-image").style.visibility = "hidden";
            document.getElementById("out-cwt").innerText = ""
            document.getElementById("cwt-size").innerText = ""
            document.getElementById("download-section").style.visibility = "hidden"
        }
    }
</script>
</html>
