<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Claim 169 Example</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .button {
            background-color: #04AA6D;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Claim 169 Example Tool</h2>

<button class="button" onclick=showClaimsGenerator()>Generate Claim 169 Data</button>
<button class="button" onclick=showQRGenerator()>Generate QR Code</button>
<div id="json-container">
    <div class="container">
        <div style="flex: 1; padding: 20px;height: 650px">
            <textarea id="json-text" oninput="generateCwt()" placeholder="Paste Your JSON Here"></textarea>
        </div>
        <div style="flex: 1; padding: 20px;height: 652px">
            <textarea contenteditable="false" id="cwt-out-text"></textarea>
        </div>
    </div>
    <h3 id="input-size" style="visibility: hidden"></h3>
    <h3 id="out-size" style="visibility: hidden"></h3>
    <h3 id="error" style="visibility: hidden">Invalid JSON</h3>
</div>
<div id="qr-container">
    <div class="container">
        <div style="flex: 1; padding: 20px;height: 650px">
            <textarea id="cwt-text" oninput="generateQR()" placeholder="Paste Your CWT Here"></textarea>
        </div>
        <div style="flex: 1; padding: 20px;height: 652px">
            <div style="border: 1px solid black; height: 654px">
                <img id="qr-image" src="" height="650px">
            </div>
        </div>
    </div>
    <h3 id="version" style="visibility: hidden"></h3>
    <div id="download-section" style="visibility: hidden">
        <a id='download' href="" title="ImageName">
            <button>Download</button>
        </a>
    </div>
</div>
</body>

<script>

    function showClaimsGenerator(){
        document.getElementById("qr-container").style.visibility = "hidden";
        document.getElementById("qr-container").style.display = "none";
        document.getElementById("json-container").style.visibility = "visible";
        document.getElementById("json-container").style.display = "block";
        document.getElementById("json-text").value = "";
        document.getElementById("cwt-out-text").value = "";
    }

    function showQRGenerator(){
        document.getElementById("json-container").style.visibility = "hidden";
        document.getElementById("json-container").style.display = "none";
        document.getElementById("qr-container").style.visibility = "visible";
        document.getElementById("qr-container").style.display = "block";
        document.getElementById("cwt-text").value = "";
        document.getElementById("qr-image").src = "";
        document.getElementById("version").innerText = ""
        document.getElementById("download-section").style.visibility = "hidden"
    }

    function generateCwt() {
        let jsonString = JSON.stringify(JSON.parse(document.getElementById("json-text").value))
        try {
            document.getElementById("error").style.visibility = "hidden";
            document.getElementById("input-size").style.visibility = "visible";
            document.getElementById("input-size").innerText = "JSON Data Size in bytes : " + jsonString.length.toString();

            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState === 4 && this.status === 200) {
                    console.log(xhttp.responseText)
                }

                document.getElementById("cwt-out-text").value = xhttp.responseText;
                document.getElementById("out-size").innerText = "CLAIM 169 converted Data Size in bytes : " + xhttp.responseText.length/2;
                document.getElementById("out-size").style.visibility = "visible";
            };
            xhttp.open("POST", 'convert', true);
            xhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
            xhttp.send(jsonString);
        } catch (e) {
            console.log(e)
            document.getElementById("error").style.visibility = "visible";
            document.getElementById("in-size").style.visibility = "hidden";
            document.getElementById("out-size").style.visibility = "hidden";
        }
    }

    function generateQR() {
        let cwt = document.getElementById("cwt-text").value
        try {
            document.getElementById("error").style.visibility = "hidden";
            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState === 4 && this.status === 200) {
                    console.log(xhttp.responseText)
                }
                let response = JSON.parse(xhttp.responseText)
                document.getElementById("qr-image").src = response[1];
                document.getElementById("download").href = response[1];
                document.getElementById("version").innerText = `Current QR version is ${response[0]}`;
                document.getElementById("download").download = `QR_v${response[0]}.PNG`
                document.getElementById("version").style.visibility = "visible";
                document.getElementById("qr-image").style.visibility = "visible";
                document.getElementById("download-section").style.visibility = "visible"
            };
            xhttp.open("POST", 'qr', true);
            xhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
            xhttp.send(JSON.stringify({"cwt": cwt}));

        } catch (e) {
            document.getElementById("error").style.visibility = "visible";
            document.getElementById("qr-image").style.visibility = "hidden";
            document.getElementById("version").style.visibility = "hidden";
            document.getElementById("download-section").style.visibility = "hidden"
        }
    }
    window.onload = () => showClaimsGenerator();
</script>
</html>
